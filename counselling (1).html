<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Counselling | Moves Education</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#161a2c;--mut:#6a7189;--bd:#e6e8f2;--bd2:#cfd3e4;--ac:#f26b1d;--wa:#1faa59;--meet:#1a73e8;--bad:#e5484d;--sh:0 6px 24px rgba(40,44,90,.08);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f111a;--card:#1a1d2b;--tx:#eef0fa;--mut:#9aa1bb;--bd:#2a2e42;--bd2:#3a3f58;--bad:#fb7185;--sh:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 calc(24px + env(safe-area-inset-bottom,0))}
.wrap{max-width:960px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,#1f2a5a,#3b3f9e);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--sh)}
.logo{background:#fff;border-radius:14px;padding:4px 10px;display:inline-flex}.logo img{height:46px;display:block}
.hero h1{margin:14px 0 4px;font-size:24px}.hero p{margin:0;opacity:.85}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.form{margin:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.form{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}.form label{margin-top:0}
input,select{width:100%;font:inherit;color:var(--tx);padding:11px 12px;border:1px solid var(--bd2);border-radius:12px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cn{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.cn.off{opacity:.6}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:34px;margin-bottom:6px}
.cn h3{margin:0;font-size:18px}.role{color:var(--ac);font-weight:600;font-size:14px}.mut{color:var(--mut);font-size:13px}
.btns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:12px}
.b{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;color:#fff;text-decoration:none;font-weight:600}
.b.wa{background:var(--wa)}.b.meet{background:var(--meet)}.b svg{width:20px;height:20px;fill:#fff}
.btn{font:inherit;color:var(--tx);padding:9px 14px;border:1px solid var(--bd2);border-radius:12px;background:var(--card);cursor:pointer}
.btn.pri{background:linear-gradient(135deg,var(--ac),#ff9a3c);border:0;color:#fff;font-weight:600}
.adm{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);width:100%}
.adm .btn{padding:6px 10px;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0;background:rgba(242,107,29,.12);border:1px solid var(--ac)}
.badge{font-size:12px;background:var(--bd);padding:2px 10px;border-radius:20px;color:var(--mut)}
.note{margin-top:18px;font-size:13px;color:var(--mut);text-align:center}.note a{color:var(--mut);cursor:pointer;text-decoration:underline}
#modal{position:fixed;inset:0;background:rgba(10,12,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px;max-height:92%;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0))}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:24px}}
.sheet h2{margin:0 0 6px;font-size:19px}.ctr{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chp{display:inline-flex!important;align-items:center;gap:6px;margin:0!important;padding:6px 12px;border:1px solid var(--bd2);border-radius:20px;font-size:14px;color:var(--tx)!important}.chp input{width:auto;padding:0}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.err{color:var(--bad);font-size:14px;margin-top:8px}
</style></head><body><div class="wrap" id="app"></div><div id="modal"></div>

firebase.initializeApp({apiKey:"AIzaSyAL_0bsr87DwPwuzG7vqReGlkmW02l0jiQ",authDomain:"moves-task-board.firebaseapp.com",projectId:"moves-task-board",storageBucket:"moves-task-board.firebasestorage.app",messagingSenderId:"503808806259",appId:"1:503808806259:web:5592d0cbd1c64c6acd8906"});
const db=firebase.firestore(),auth=firebase.auth(),col=db.collection('counsellors');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#f26b1d','#e0457b','#0ea5a4','#3b82f6','#8b5cf6'];
const WA='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.6.3.1.2.1.8-.1 1.4z"/></svg>';
const MEET='<svg viewBox="0 0 24 24"><path d="M15 8v8H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h10zm1 2.5 5-3.5v10l-5-3.5v-3z"/></svg>';
const ALL='All countries',DEF=['UK','Australia','Canada','USA','New Zealand','Europe','Malaysia'];
let list=[],user=null,loaded=0,editId=null,photo='',delId=null,sn='',sc=ALL,countries=DEF,tmpC=[];
const shown=()=>{const l=user?list:list.filter(c=>c.active!==false);return sc===ALL?l:l.filter(c=>!(c.countries&&c.countries.length)||c.countries.includes(sc))};
function normPhone(s){let d=String(s).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='88'+d;else if(d.length===10&&d.startsWith('1'))d='880'+d;return d}
function normMeet(s){s=String(s).trim();if(!s)return'';if(!/^https?:\/\//i.test(s))s='https://'+s;return s}
function msg(c){return `Hello ${c.name}, ${sn?'I am '+sn+'. ':''}I would like free counselling about studying abroad${sc!==ALL?' in '+sc:''}. Can we talk?`}
function av(c,i){return c.photo?`<img class="av" src="${c.photo}" alt="">`:`<div class="av" style="background:${COL[i%5]}">${esc((c.name||'?').trim()[0]||'?').toUpperCase()}</div>`}

function render(){
  if(document.activeElement&&document.activeElement.id==='sn')return;
  const L=shown();
  let h=`<div class="hero"><div class="logo"><img src="${LOGO}" alt="Moves"></div><h1>Free Study Abroad Counselling</h1><p>Choose a counsellor and talk to them directly on WhatsApp or Google Meet.</p></div>`;
  if(user)h+=`<div class="card bar"><div><b>Staff mode</b><div class="mut">${esc(user.email)}</div></div><div class="row" style="margin:0"><button class="btn pri" data-act="add">+ Add counsellor</button><button class="btn" data-act="countries">🌍 Countries</button><button class="btn" data-act="logout">Log out</button></div></div>`;
  h+=`<div class="form card"><div><label>Your name (optional)</label><input id="sn" value="${esc(sn)}" placeholder="e.g. Karim Ahmed"></div><div><label>Where do you want to study?</label><select id="sc">${[ALL,...countries].map(o=>`<option ${o===sc?'selected':''}>${o}</option>`).join('')}</select></div></div>`;
  if(!loaded)h+='<div class="card mut" style="text-align:center">Loading…</div>';
  else if(!L.length)h+=`<div class="card mut" style="text-align:center">${sc!==ALL?'No counsellor is listed for '+esc(sc)+' yet. Please try “All countries”.':user?'No counsellors yet. Tap “+ Add counsellor”.':'Counsellors will be listed here soon.'}</div>`;
  else h+='<div class="grid">'+L.map((c,i)=>`<div class="card cn ${c.active===false?'off':''}">${av(c,i)}<h3>${esc(c.name)}</h3><div class="role">${esc(c.designation||'')}</div><div class="mut">${c.hours?'🕘 '+esc(c.hours):''}</div><div class="mut">${(c.countries||[]).length?'🌍 '+c.countries.map(esc).join(' · '):''}</div>${c.active===false?'<span class="badge">Hidden from students</span>':''}
<div class="btns">${c.phone?`<a class="b wa" data-wa="${c.id}" href="#" target="_blank" rel="noopener">${WA} WhatsApp Call / Chat</a>`:''}${c.meet?`<a class="b meet" href="${esc(c.meet)}" target="_blank" rel="noopener">${MEET} Join Google Meet</a>`:''}</div>
${user?`<div class="adm"><button class="btn" data-act="edit" data-id="${c.id}">✏️ Edit</button><button class="btn" data-act="up" data-id="${c.id}">▲</button><button class="btn" data-act="down" data-id="${c.id}">▼</button><button class="btn" data-act="vis" data-id="${c.id}">${c.active===false?'Show':'Hide'}</button><button class="btn" data-act="del" data-id="${c.id}">${delId===c.id?'Sure? 🗑':'🗑'}</button></div>`:''}</div>`).join('')+'</div>';
  h+=`<div class="note">Counsellors reply during office hours. If a call is not answered, please try another counsellor.${user?'':'<br><a data-act="login">Staff login</a>'}</div>`;
  $('#app').innerHTML=h}

const modal=h=>{$('#modal').innerHTML=`<div class="sheet">${h}</div>`;$('#modal').classList.add('on')};
const close=()=>{$('#modal').classList.remove('on');$('#modal').innerHTML=''};
function loginModal(){modal(`<h2>Staff login</h2><label>Email</label><input id="l-e" type="email" autocomplete="username"><label>Password</label><input id="l-p" type="password" autocomplete="current-password"><div class="err" id="l-err"></div><div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="dologin">Log in</button></div>`)}
async function doLogin(){try{await auth.signInWithEmailAndPassword($('#l-e').value.trim(),$('#l-p').value);close()}catch(e){$('#l-err').textContent='Login failed. Check your email and password.'}}
function formModal(id){editId=id||null;const c=id?list.find(x=>x.id===id):{};photo=c.photo||'';
  modal(`<h2>${id?'Edit counsellor':'Add counsellor'}</h2><div class="ctr"><div id="pv">${av({name:c.name||'?',photo},0)}</div><label class="btn" style="margin:0">📷 Choose photo<input type="file" id="ph" accept="image/*" hidden></label></div>
  <label>Name *</label><input id="f-n" value="${esc(c.name)}" placeholder="e.g. Rahim Uddin">
  <label>Designation</label><input id="f-d" value="${esc(c.designation)}" placeholder="e.g. Senior Counsellor (UK & Australia)">
  <label>Available hours</label><input id="f-h" value="${esc(c.hours)}" placeholder="e.g. Sat–Thu, 10 AM – 6 PM">
  <label>WhatsApp number</label><input id="f-p" inputmode="tel" value="${esc(c.phone)}" placeholder="e.g. 01712345678">
  <label>Google Meet link</label><input id="f-m" value="${esc(c.meet)}" placeholder="https://meet.google.com/abc-defg-hij">
  <label>Countries handled <span class="mut">(leave empty = all countries)</span></label><div class="chips">${countries.map(k=>`<label class="chp"><input type="checkbox" class="cc" value="${esc(k)}" ${(c.countries||[]).includes(k)?'checked':''}> ${esc(k)}</label>`).join('')||'<span class="mut">Add countries from “🌍 Countries” first.</span>'}</div>
  <div class="err" id="f-err"></div><div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="save">Save</button></div>`)}
function countriesModal(){modal(`<h2>Countries</h2><div class="mut">Students can filter counsellors by these countries.</div><div class="chips" style="margin:12px 0">${tmpC.map((k,i)=>`<span class="chp">${esc(k)} <a data-act="rmc" data-i="${i}" style="cursor:pointer;color:var(--bad)">✕</a></span>`).join('')||'<span class="mut">No countries yet</span>'}</div><div style="display:flex;gap:8px"><input id="nc" placeholder="Add a country, e.g. Germany"><button class="btn pri" data-act="addc">Add</button></div><div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="savec">Save</button></div>`)}
function readPhoto(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);r(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(f)})}
async function save(){
  const name=$('#f-n').value.trim();if(!name){$('#f-err').textContent='Name is required.';return}
  const phone=normPhone($('#f-p').value),meet=normMeet($('#f-m').value);
  if(phone&&(phone.length<10||phone.length>15)){$('#f-err').textContent='Please check the WhatsApp number.';return}
  if(meet&&!/^https:\/\/meet\.google\.com\/[A-Za-z0-9\-_\/?=&.]+$/.test(meet)){$('#f-err').textContent='Meet link should look like https://meet.google.com/abc-defg-hij';return}
  const d={name,designation:$('#f-d').value.trim(),hours:$('#f-h').value.trim(),phone,meet,photo,countries:[...document.querySelectorAll('.cc:checked')].map(x=>x.value)};
  try{if(editId)await col.doc(editId).update(d);else await col.add({...d,active:true,order:Date.now()});close()}
  catch(e){$('#f-err').textContent='Could not save. Make sure you are logged in with an admin account.'}}
async function swap(id,dir){const i=list.findIndex(c=>c.id===id),j=i+dir;if(j<0||j>=list.length)return;const a=list[i],b=list[j],oa=a.order??a.created??0,ob=b.order??b.created??0;
  try{const bt=db.batch();bt.update(col.doc(a.id),{order:ob===oa?ob+dir:ob});bt.update(col.doc(b.id),{order:oa});await bt.commit()}catch(e){alert('Not allowed.')}}
const guard=p=>p.catch(()=>alert('Not allowed. Please log in with an admin account.'));
function act(a,d){
  if(a==='login')loginModal();else if(a==='dologin')doLogin();else if(a==='logout')auth.signOut();
  else if(a==='add')formModal();else if(a==='edit')formModal(d.id);else if(a==='save')save();else if(a==='close')close();
  else if(a==='countries'){tmpC=[...countries];countriesModal()}
  else if(a==='addc'){const v=$('#nc').value.trim();if(v&&!tmpC.some(x=>x.toLowerCase()===v.toLowerCase()))tmpC.push(v);countriesModal()}
  else if(a==='rmc'){tmpC.splice(+d.i,1);countriesModal()}
  else if(a==='savec'){const v=$('#nc').value.trim();if(v&&!tmpC.some(x=>x.toLowerCase()===v.toLowerCase()))tmpC.push(v);guard(col.doc('_settings').set({countries:tmpC}).then(close))}
  else if(a==='up')swap(d.id,-1);else if(a==='down')swap(d.id,1);
  else if(a==='vis'){const c=list.find(x=>x.id===d.id);guard(col.doc(d.id).update({active:c.active===false}))}
  else if(a==='del'){if(delId!==d.id){delId=d.id;render()}else{delId=null;guard(col.doc(d.id).delete())}}}
document.addEventListener('click',e=>{if(e.target.id==='modal'){close();return}
  const w=e.target.closest('[data-wa]');if(w){const c=list.find(x=>x.id===w.dataset.wa);w.href='https://wa.me/'+c.phone+'?text='+encodeURIComponent(msg(c));return}
  const b=e.target.closest('[data-act]');if(b){e.preventDefault();act(b.dataset.act,b.dataset)}});
document.addEventListener('input',e=>{if(e.target.id==='sn')sn=e.target.value.trim()});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='sc'){sc=t.value;render()}
  else if(t.id==='ph'&&t.files[0]){photo=await readPhoto(t.files[0]);$('#pv').innerHTML=av({name:$('#f-n').value||'?',photo},0)}});
col.onSnapshot(s=>{list=s.docs.filter(d=>d.id!=='_settings').map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??1e15)-(b.order??1e15));const st=s.docs.find(d=>d.id==='_settings');countries=(st&&st.data().countries)||DEF;loaded=1;render()},()=>{loaded=1;render()});
auth.onAuthStateChanged(u=>{user=u;render()});
render();
</script></body></html>
